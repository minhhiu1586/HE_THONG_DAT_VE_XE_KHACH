components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: datvexe_session
  schemas:
    Profile:
      type: object
      required:
      - maNguoiDung
      - hoTen
      - email
      - soDienThoai
      - loaiTaiKhoan
      - trangThai
      properties:
        maNguoiDung:
          type: string
        hoTen:
          type: string
        email:
          type: string
        soDienThoai: &id001
          type: string
        gioiTinh: &id002
          type:
          - string
          - 'null'
          enum:
          - NAM
          - NU
          - KHAC
          - null
        ngaySinh: &id003
          type:
          - string
          - 'null'
          format: date
        cccd: &id004
          type:
          - string
          - 'null'
        loaiTaiKhoan:
          type: string
          enum:
          - KHACH_HANG
          - NHA_XE
          - NHAN_VIEN
          - ADMIN
        trangThai:
          type: string
          enum:
          - HOAT_DONG
          - KHOA
          - CHO_XAC_THUC
    DangKy:
      type: object
      additionalProperties: false
      required:
      - hoTen
      - email
      - soDienThoai
      - matKhau
      properties:
        hoTen: &id006
          type: string
          minLength: 1
          maxLength: 160
        email: &id007
          type: string
          format: email
          maxLength: 254
        soDienThoai: *id001
        gioiTinh: *id002
        ngaySinh: *id003
        cccd: *id004
        matKhau: &id008
          type: string
          minLength: 10
          maxLength: 128
          writeOnly: true
          description: Có chữ và số.
    DangNhap:
      type: object
      additionalProperties: false
      required:
      - email
      - matKhau
      properties:
        email: *id005
        matKhau:
          type: string
          maxLength: 128
          writeOnly: true
    HoSo:
      type: object
      additionalProperties: false
      required:
      - hoTen
      - email
      - soDienThoai
      properties:
        hoTen: *id006
        email: *id007
        soDienThoai: *id001
        gioiTinh: *id002
        ngaySinh: *id003
        cccd: *id004
    DoiMatKhau:
      type: object
      additionalProperties: false
      required:
      - matKhauHienTai
      - matKhauMoi
      properties:
        matKhauHienTai:
          type: string
          writeOnly: true
        matKhauMoi: *id008
    TrangThai:
      type: object
      additionalProperties: false
      required:
      - trangThai
      properties:
        trangThai:
          type: string
          enum:
          - KHOA
          - HOAT_DONG
    Session:
      type: object
      required:
      - nguoiDung
      - csrfToken
      - hetHan
      properties:
        nguoiDung:
          $ref: '#/components/schemas/Profile'
        csrfToken: *id005
        hetHan:
          type: string
          format: date-time
    AccountPage:
      type: object
      required:
      - items
      - page
      - size
      - totalItems
      - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Profile'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 0
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
