              maKhuyenMai: KM10
      responses:
        '200':
          description: Updated order and price preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingOrderResponse'
        '400':
          $ref: '#/components/responses/BookingBadRequest'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '403':
          $ref: '#/components/responses/BookingForbidden'
        '404':
          $ref: '#/components/responses/BookingNotFound'
        '409':
          $ref: '#/components/responses/BookingConflict'
      x-api-id: B08c
      x-contract-status: implemented
    delete:
      tags:
      - B — Giữ chỗ và đơn đặt vé
      operationId: removeBookingPromotion
      summary: B08d Remove selected promotion
      description: KHACH_HANG only; owner access.
      x-roles:
      - KHACH_HANG
      parameters:
      - $ref: '#/components/parameters/BookingCsrfToken'
      responses:
        '200':
          description: Updated order and price preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingOrderResponse'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '403':
          $ref: '#/components/responses/BookingForbidden'
        '404':
          $ref: '#/components/responses/BookingNotFound'
        '409':
          $ref: '#/components/responses/BookingConflict'
      x-api-id: B08d
      x-contract-status: implemented
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: datvexe_session
  headers:
    TraceId:
      description: Mã truy vết do máy chủ tạo hoặc kiểm soát; có cùng giá trị với traceId trong phản hồi lỗi.
      schema: {type: string, minLength: 1}
    IdempotencyKey:
      description: Key do client sinh; cùng key và cùng payload trả lại cùng kết quả.
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$'}
    OrderLocation:
      description: URI tài nguyên đơn vừa tạo.
      schema: {type: string, format: uri-reference, example: /api/booking/DDV01}
    PaymentLocation:
      description: URI tra cứu lần thanh toán đã ghi nhận.
      schema: {type: string, format: uri-reference, example: /api/thanh-toan/GD01}
    RefundLocation:
      description: URI tra cứu yêu cầu hoàn đã nhận.
      schema: {type: string, format: uri-reference, example: /api/hoan-tien/HT01}
  parameters:
    BookingCsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    BookingIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    BookingMaDon:
      name: maDon
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/BookingId'
    BookingMaGhe:
      name: maGhe
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/BookingId'
    CsrfToken:
      in: header
      name: X-CSRF-Token
      required: true
      description: Lấy từ đăng nhập hoặc GET /api/tai-khoan/me.
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      description: Số trang bắt đầu từ 1; mặc định 1.
      schema: {type: integer, minimum: 1, default: 1}
    Size:
      name: size
      in: query
      required: false
      description: Kích thước trang; mặc định 20, tối đa 100.
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Bắt buộc cho thao tác ghi có thể retry. Key gắn với request payload và chủ thể.
      schema: {type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$'}
    MaChuyen:
      name: maChuyen
      in: path
      required: true
      description: Mã chuyến opaque.
      schema: {$ref: '#/components/schemas/Id'}
    MaDon:
      name: maDon
      in: path
      required: true
      description: Mã đơn opaque.
      schema: {$ref: '#/components/schemas/Id'}
    MaVe:
      name: maVe
      in: path
      required: true
      description: Mã vé opaque.
      schema: {$ref: '#/components/schemas/Id'}
    MaGiaoDich:
      name: maGiaoDich
      in: path
      required: true
      description: Mã giao dịch nội bộ, không phải mã giao dịch cổng.
      schema: {$ref: '#/components/schemas/TransactionId'}
    MaHoanTien:
      name: maHoanTien
      in: path
      required: true
      description: Mã yêu cầu hoàn opaque.
      schema: {$ref: '#/components/schemas/Id'}
  responses:
    BookingBadRequest:
      description: Invalid request or validation error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BookingErrorResponse'
    BookingUnauthorized:
      description: Missing or expired session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BookingErrorResponse'
    BookingForbidden:
      description: Wrong role, CSRF failure, or caller does not own the order.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BookingErrorResponse'
    BookingNotFound:
      description: Order, trip, or seat not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BookingErrorResponse'
    BookingConflict:
      description: Seat unavailable, hold expired, invalid state, or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BookingErrorResponse'
    BadRequest:
      description: Request, query hoặc header sai định dạng; fieldErrors chỉ xuất hiện khi được xác định.
      headers:
        X-Trace-Id: {$ref: '#/components/headers/TraceId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            validationError:
              value:
                code: VALIDATION_ERROR
                message: Request không hợp lệ.
                details: {}
                timestamp: '2026-10-11T09:30:00+07:00'
                traceId: req-validation-001
    Unauthenticated:
      description: Chưa đăng nhập, phiên hết hạn/thu hồi hoặc tài khoản không hoạt động; xác thực cookie theo T07.
      headers:
        X-Trace-Id: {$ref: '#/components/headers/TraceId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            unauthenticated:
              value: {code: UNAUTHENTICATED, message: Cần xác thực., details: {}, timestamp: '2026-10-11T09:30:00+07:00', traceId: req-auth-001}
    Forbidden:
      description: Đã xác thực nhưng không đủ quyền hoặc ngoài phạm vi.
      headers:
        X-Trace-Id: {$ref: '#/components/headers/TraceId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            forbidden:
              value: {code: FORBIDDEN, message: Không có quyền thực hiện thao tác., details: {}, timestamp: '2026-10-11T09:30:00+07:00', traceId: req-auth-002}
    NotFound:
      description: Không tìm thấy hoặc không được phép biết tài nguyên tồn tại.
      headers:
        X-Trace-Id: {$ref: '#/components/headers/TraceId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            notFound:
              value: {code: RESOURCE_NOT_FOUND, message: Không tìm thấy tài nguyên., details: {}, timestamp: '2026-10-11T09:30:00+07:00', traceId: req-not-found-001}
    StateConflict:
      description: "409 khi trạng thái hiện tại không cho phép thao tác. Cùng Idempotency-Key với nội dung khác trả IDEMPOTENCY_KEY_REUSED; yêu cầu cùng key đang xử lý trả REQUEST_IN_PROGRESS."
      headers:
        X-Trace-Id: {$ref: '#/components/headers/TraceId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            conflict:
              value: {code: INVALID_STATE_TRANSITION, message: Trạng thái hiện tại không cho phép thao tác., details: {}, timestamp: '2026-10-11T09:30:00+07:00', traceId: req-conflict-001}
            idempotencyKeyReused:
              value: {code: IDEMPOTENCY_KEY_REUSED, message: Idempotency-Key đã được dùng với nội dung khác., details: {}, timestamp: '2026-10-11T09:30:01+07:00', traceId: req-conflict-002}
            requestInProgress:
              value: {code: REQUEST_IN_PROGRESS, message: Yêu cầu cùng key vẫn đang xử lý., details: {}, timestamp: '2026-10-11T09:30:02+07:00', traceId: req-conflict-003}
    HoldExpired:
      description: Quyền giữ của đơn đã hết hạn.
      headers:
        X-Trace-Id: {$ref: '#/components/headers/TraceId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            expired:
              value: {code: HOLD_EXPIRED, message: Quyền giữ chỗ của đơn đã hết hạn., details: {maDon: DDV01, thoiDiemHetHan: '2026-10-11T09:45:00+07:00'}, timestamp: '2026-10-11T09:46:00+07:00', traceId: req-order-003}
    PromotionConflict:
      description: Mã khuyến mãi không áp dụng được theo điều kiện hiện tại.
      headers:
        X-Trace-Id: {$ref: '#/components/headers/TraceId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            notApplicable:
              value: {code: PROMOTION_NOT_APPLICABLE, message: Mã khuyến mãi không áp dụng được., details: {}, timestamp: '2026-10-11T09:32:00+07:00', traceId: req-quote-001}
    QuoteConflict:
      description: "409 khi báo giá hết hạn, giá thay đổi hoặc quota khuyến mãi không còn. Cùng Idempotency-Key với nội dung khác trả IDEMPOTENCY_KEY_REUSED; yêu cầu cùng key đang xử lý trả REQUEST_IN_PROGRESS."
      headers:
        X-Trace-Id: {$ref: '#/components/headers/TraceId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            quoteExpired:
              value: {code: QUOTE_EXPIRED, message: Báo giá hết hiệu lực; hãy tính lại., details: {maBaoGia: BG01}, timestamp: '2026-10-11T09:46:00+07:00', traceId: req-price-004}
            priceChanged:
              value: {code: PRICE_CHANGED, message: Giá đã thay đổi; hãy tính lại báo giá., details: {maDon: DDV01}, timestamp: '2026-10-11T09:46:01+07:00', traceId: req-price-005}
            promotionExhausted:
              value: {code: PROMOTION_EXHAUSTED, message: Mã khuyến mãi đã hết lượt., details: {}, timestamp: '2026-10-11T09:46:02+07:00', traceId: req-price-006}
    PaymentConflict:
      description: "409 khi phương thức không hợp lệ, giá chưa chốt hoặc lần thanh toán khác đang xử lý. Cùng Idempotency-Key với nội dung khác trả IDEMPOTENCY_KEY_REUSED; yêu cầu cùng key đang xử lý trả REQUEST_IN_PROGRESS."
      headers:
        X-Trace-Id: {$ref: '#/components/headers/TraceId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            processing:
              value: {code: PAYMENT_PROCESSING, message: Có lần thanh toán đang xử lý; hãy tra cứu trước., details: {maGiaoDich: GD01}, timestamp: '2026-10-11T09:33:01+07:00', traceId: req-pay-005}
    RefundConflict:
      description: "409 khi trạng thái vé không cho phép hủy/hoàn hoặc đã có yêu cầu hoàn đang xử lý. Cùng Idempotency-Key với nội dung khác trả IDEMPOTENCY_KEY_REUSED; yêu cầu cùng key đang xử lý trả REQUEST_IN_PROGRESS."
      headers:
        X-Trace-Id: {$ref: '#/components/headers/TraceId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            refundNotAllowed:
              value: {code: REFUND_NOT_ALLOWED, message: Vé chưa đủ điều kiện gửi yêu cầu hoàn tiền., details: {maVe: VE01}, timestamp: '2026-10-11T10:00:01+07:00', traceId: req-refund-006}
    InternalError:
      description: Lỗi nội bộ; không trả stack trace hoặc dữ liệu nhạy cảm.
      headers:
        X-Trace-Id: {$ref: '#/components/headers/TraceId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            internalError:
              value: {code: INTERNAL_ERROR, message: Đã xảy ra lỗi nội bộ., details: {}, timestamp: '2026-10-11T09:30:00+07:00', traceId: req-error-001}
    UnsupportedMediaType:
      description: Content-Type không được hỗ trợ.
      headers:
        X-Trace-Id: {$ref: '#/components/headers/TraceId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            unsupportedMediaType:
              value: {code: UNSUPPORTED_MEDIA_TYPE, message: Chỉ hỗ trợ application/json., details: {}, timestamp: '2026-10-11T09:30:00+07:00', traceId: req-media-001}
    ProviderError:
      description: Phụ thuộc thanh toán hoặc hoàn tiền gặp lỗi; tra cứu ID đã cấp trước khi retry.
      headers:
        X-Trace-Id: {$ref: '#/components/headers/TraceId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            providerError:
              value: {code: PAYMENT_PROVIDER_ERROR, message: Dịch vụ thanh toán chưa phản hồi ổn định., details: {}, timestamp: '2026-10-11T09:33:02+07:00', traceId: req-provider-001}
    ServiceUnavailable:
      description: Dịch vụ tạm thời chưa sẵn sàng.
      headers:
        Retry-After:
          description: Thời gian chờ trước khi thử lại, theo giây.
          schema: {type: integer, minimum: 1}
        X-Trace-Id: {$ref: '#/components/headers/TraceId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            unavailable:
              value: {code: SERVICE_UNAVAILABLE, message: Dịch vụ tạm thời chưa sẵn sàng., details: {}, timestamp: '2026-10-11T09:33:03+07:00', traceId: req-provider-002}
  schemas:
    BookingId:
      type: string
      minLength: 1
      maxLength: 40
    BookingTimestamp:
      type: string
      format: date-time
    BookingDecimalMoney:
      type: string
      pattern: ^[0-9]+(\.[0-9]+)?$
      description: Exact decimal preview value; unlike T05 integer-VND contracts, no rounding or scale reduction occurs
        before T17 price freeze.
    BookingHoldRequest:
      type: object
      required:
      - maChuyen
      - danhSachMaGhe
      properties:
        maChuyen:
          $ref: '#/components/schemas/BookingId'
        danhSachMaGhe:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/BookingId'
      additionalProperties: false
    BookingSeatHold:
      type: object
      required:
      - maGiuCho
      - maGhe
      - trangThai
      - thoiDiemBatDau
      - thoiDiemHetHan
      properties:
        maGiuCho:
          $ref: '#/components/schemas/BookingId'
        maGhe:
          $ref: '#/components/schemas/BookingId'
        trangThai:
          type: string
          enum:
          - DANG_GIU
          - DA_XAC_NHAN
          - HET_HAN
          - DA_HUY
        thoiDiemBatDau:
          $ref: '#/components/schemas/BookingTimestamp'
        thoiDiemHetHan:
          $ref: '#/components/schemas/BookingTimestamp'
      additionalProperties: false
    BookingHoldSeatResponse:
      type: object
      required:
      - maDon
      - maChuyen
      - trangThaiDon
      - serverTime
      - thoiDiemBatDau
      - thoiDiemHetHan
      - danhSachGheGiu
      - danhSachGiuCho
      properties:
        maDon:
          $ref: '#/components/schemas/BookingId'
        maChuyen:
          $ref: '#/components/schemas/BookingId'
        trangThaiDon:
          type: string
        serverTime:
          $ref: '#/components/schemas/BookingTimestamp'
        thoiDiemBatDau:
          $ref: '#/components/schemas/BookingTimestamp'
        thoiDiemHetHan:
          $ref: '#/components/schemas/BookingTimestamp'
        danhSachGheGiu:
          type: array
          items:
            $ref: '#/components/schemas/BookingId'
        danhSachGiuCho:
          type: array
          items:
            $ref: '#/components/schemas/BookingSeatHold'
      additionalProperties: false
    BookingContactPatch:
      type: object
      minProperties: 1
      properties:
        khachDatTen:
          type: string
          minLength: 1
          maxLength: 120
        khachDatSoDienThoai:
          type: string
          minLength: 1
          maxLength: 20
        ghiChu:
          type:
          - string
          - 'null'
          maxLength: 500
      additionalProperties: false
    BookingPassenger:
      type: object
      required:
      - maGhe
      - hoTen
      - soDienThoai
      properties:
        maGhe:
          $ref: '#/components/schemas/BookingId'
        hoTen:
          type: string
          minLength: 1
          maxLength: 120
        soDienThoai:
          type: string
          minLength: 1
          maxLength: 20
        cccd:
          type:
          - string
          - 'null'
          maxLength: 20
      additionalProperties: false
    BookingPassengerUpdate:
      type: object
      required:
      - hanhKhach
      properties:
        hanhKhach:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/BookingPassenger'
      additionalProperties: false
    BookingSeatSwapRequest:
      type: object
      required:
      - maGheCu
      - maGheMoi
      properties:
        maGheCu:
          $ref: '#/components/schemas/BookingId'
        maGheMoi:
          $ref: '#/components/schemas/BookingId'
      additionalProperties: false
    BookingPromotionSelection:
      type: object
      required:
      - maKhuyenMai
      properties:
        maKhuyenMai:
          type: string
          minLength: 1
          maxLength: 40
      additionalProperties: false
    BookingSeatHoldSummary:
      type: object
      required:
      - maGiuCho
      - maGhe
      - trangThai
      - thoiDiemBatDau
      - thoiDiemHetHan
      properties:
        maGiuCho:
          $ref: '#/components/schemas/BookingId'
        maGhe:
          $ref: '#/components/schemas/BookingId'
        trangThai:
          type: string
        thoiDiemBatDau:
          $ref: '#/components/schemas/BookingTimestamp'
        thoiDiemHetHan:
          $ref: '#/components/schemas/BookingTimestamp'
      additionalProperties: false
    BookingOrderTicket:
      type: object
      required:
      - maVe
      - maGhe
      - hoTen
      - soDienThoai
      - cccd
      - giaVe
      - trangThai
      - ngayXuatVe
      properties:
        maVe:
          $ref: '#/components/schemas/BookingId'
        maGhe:
          $ref: '#/components/schemas/BookingId'
        hoTen:
          type: string
          minLength: 1
          maxLength: 120
        soDienThoai:
          type: string
          minLength: 1
          maxLength: 20
        cccd:
          type:
          - string
          - 'null'
        giaVe:
          $ref: '#/components/schemas/BookingDecimalMoney'
        trangThai:
          type: string
          enum:
          - DA_XUAT_VE
          - DA_LEN_XE
          - DA_HOAN
          - DA_HUY
        ngayXuatVe:
          anyOf:
          - $ref: '#/components/schemas/BookingTimestamp'
          - type: 'null'
      additionalProperties: false
    BookingPricePreview:
      type: object
      required:
      - tongTienGoc
      - tienGiam
      - tongThanhToan
      - maKhuyenMaiDaChon
      - maKhuyenMaiApDung
      - lyDoKhongApDung
      properties:
        tongTienGoc:
          $ref: '#/components/schemas/BookingDecimalMoney'
        tienGiam:
          $ref: '#/components/schemas/BookingDecimalMoney'
        tongThanhToan:
          $ref: '#/components/schemas/BookingDecimalMoney'
        maKhuyenMaiDaChon:
          type:
          - string
          - 'null'
        maKhuyenMaiApDung:
          type:
          - string
          - 'null'
        lyDoKhongApDung:
          type:
          - string
          - 'null'
      additionalProperties: false
    BookingOrderResponse:
      type: object
      description: hanhKhach is a normalized passenger snapshot from the current authenticated account and JSESSIONID;
        a fresh HTTP session returns an empty array. PATCH idempotency data in PostgreSQL redacts hanhKhach/coTheChotGia.
        A complete PATCH replay is available only if its response was written and remains in the current HTTP session;
        the cache may be absent after a crash between database commit and session write or after session loss, in which
        case retry returns the redacted database order state. Expiry commits the hold and order as HET_HAN before returning
        409 HOLD_EXPIRED. danhSachVe always stays empty before T17/T18 issuance. T16 never creates a ticket draft or
        HanhKhach database entity. T18 callbacks cannot assume the session passenger snapshot remains available.
      required:
      - maDon
      - maChuyen
      - trangThaiDon
      - khachDatTen
      - khachDatSoDienThoai
      - ghiChu
      - serverTime
      - thoiDiemBatDau
      - thoiDiemHetHan
      - danhSachGiuCho
      - hanhKhach
      - danhSachVe
      - giaTamTinh
      - coTheChotGia
      - giaDaChot
      - thongBao
      properties:
        maDon:
          $ref: '#/components/schemas/BookingId'
        maChuyen:
          $ref: '#/components/schemas/BookingId'
        trangThaiDon:
          type: string
        khachDatTen:
          type: string
          minLength: 1
          maxLength: 120
        khachDatSoDienThoai:
          type: string
          minLength: 1
          maxLength: 20
        ghiChu:
          type:
          - string
          - 'null'
          maxLength: 500
        serverTime:
          $ref: '#/components/schemas/BookingTimestamp'
        thoiDiemBatDau:
          anyOf:
          - $ref: '#/components/schemas/BookingTimestamp'
          - type: 'null'
        thoiDiemHetHan:
          anyOf:
          - $ref: '#/components/schemas/BookingTimestamp'
          - type: 'null'
        danhSachGiuCho:
          type: array
          items:
            $ref: '#/components/schemas/BookingSeatHoldSummary'
        hanhKhach:
          type: array
          items:
            $ref: '#/components/schemas/BookingPassenger'
        danhSachVe:
          type: array
          items:
            $ref: '#/components/schemas/BookingOrderTicket'
          description: Always empty until a ticket is actually issued.
        giaTamTinh:
          $ref: '#/components/schemas/BookingPricePreview'
        coTheChotGia:
          type: boolean
          description: False until the current HTTP session has a valid passenger for every held seat.
        giaDaChot:
          anyOf:
          - {$ref: '#/components/schemas/FrozenPrice'}
          - type: 'null'
          description: T16 returns null before C02; after T17 C02 succeeds, B05 returns the current persisted money snapshot. It has no quote version or quote timestamp and is not usable for payment after the order closes.
        thongBao:
          type: array
          items:
            type: string
      additionalProperties: false
    BookingErrorResponse:
      type: object
      required:
      - code
      - message
      - details
      - timestamp
      - traceId
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
        timestamp:
          $ref: '#/components/schemas/BookingTimestamp'
        traceId:
          type: string
      additionalProperties: false
    Id:
      type: string
      minLength: 1
      maxLength: 40
      description: Mã opaque; client không suy luận quyền hoặc thứ tự từ mã.
      example: CX01
    TransactionId:
      type: string
      minLength: 1
      maxLength: 80
      description: Mã giao dịch nội bộ opaque; tối đa 80 ký tự.
      example: GD01
    LocalDate:
      type: string
      format: date
      pattern: '^\d{4}-\d{2}-\d{2}$'
      description: Ngày lịch địa phương Asia/Ho_Chi_Minh, YYYY-MM-DD.
      example: '2026-10-12'
    LocalTime:
      type: string
      pattern: '^(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d$'
      description: Giờ lịch theo local time, HH:mm:ss.
      example: '08:00:00'
    OffsetDateTime:
      type: string
      format: date-time
      description: Thời điểm RFC3339 có offset; mốc server là nguồn quyết định.
      example: '2026-10-11T09:30:00+07:00'
    MoneyVnd:
      type: string
      pattern: '^(0|[1-9][0-9]{0,11})$'
