      tags: [E — Hủy vé và hoàn tiền]
      operationId: huyVeXe
      summary: "[E02] Hủy vé theo chính sách"
      description: |-
        Chỉ hủy trực tiếp khi chính sách cho phép; thao tác này không bỏ qua quy trình yêu cầu hoàn tiền. Ví dụ VE02 minh họa trường hợp giả định được phép hủy nhưng không tạo yêu cầu hoàn; chính sách này vẫn đang chờ nhóm xác nhận.
        Yêu cầu đăng nhập. Quyền: khách hàng (KH), nhân viên (NV), nhà xe (NX). Phạm vi: KH theo chủ vé; NV/NX theo phạm vi và chính sách được duyệt.
      x-api-id: E02
      x-contract-status: proposed
      x-roles: [KH, NV, NX]
      security: [{cookieAuth: []}]
      x-authentication-required: true
      x-ownership: KH theo chủ vé; NV/NX theo phạm vi và chính sách được duyệt.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - {$ref: '#/components/parameters/MaVe'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200':
          description: Kết quả hủy trực tiếp của vé. Ví dụ VE02 giả định hủy được nhưng không được tạo yêu cầu hoàn; đây chỉ là tình huống minh họa, chính sách còn chờ xác nhận.
          headers:
            X-Trace-Id: {$ref: '#/components/headers/TraceId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CancelTicketResponse'}
              examples:
                success:
                  value: {maVe: VE02, trangThai: DA_HUY, thoiDiemHuy: '2026-10-11T10:00:00+07:00', canTaoYeuCauHoan: false}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/RefundConflict'}
  /api/ve-xe/{maVe}/hoan-tien:
    post:
      tags: [E — Hủy vé và hoàn tiền]
      operationId: createRefund
      summary: "[E03] Gửi yêu cầu hoàn tiền cho một vé"
      description: |-
        Máy chủ xác định số tiền hoàn. Trả 202 khi đã nhận yêu cầu xử lý; điều đó chưa khẳng định tiền đã được hoàn. Có thể bỏ trường lyDo hoặc gửi JSON object rỗng ({}) nếu không có lý do; quy định bắt buộc lý do vẫn chờ nhóm thống nhất.
        Yêu cầu đăng nhập. Quyền: khách hàng (KH), nhân viên (NV), nhà xe (NX). Phạm vi: KH theo chủ vé; NV/NX theo phạm vi và chính sách được duyệt.
      x-api-id: E03
      x-contract-status: proposed
      x-roles: [KH, NV, NX]
      security: [{cookieAuth: []}]
      x-authentication-required: true
      x-ownership: KH theo chủ vé; NV/NX theo phạm vi và chính sách được duyệt.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - {$ref: '#/components/parameters/MaVe'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefundRequest'}
            examples:
              request:
                value: {lyDo: Thay đổi kế hoạch}
              withoutReason:
                value: {}
      responses:
        '202':
          description: Yêu cầu hoàn đã nhận; trạng thái cuối phụ thuộc workflow/provider.
          headers:
            Location: {$ref: '#/components/headers/RefundLocation'}
            X-Trace-Id: {$ref: '#/components/headers/TraceId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RefundResponse'}
              examples:
                accepted:
                  value: {maHoanTien: HT01, maVe: VE01, maGiaoDichGoc: GD01, soTienHoan: '180000', trangThai: CHO_XU_LY, thoiDiemTao: '2026-10-11T10:00:00+07:00'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/RefundConflict'}
    get:
      tags: [E — Hủy vé và hoàn tiền]
      operationId: listTicketRefunds
      summary: "[E05] Lịch sử yêu cầu hoàn của vé"
      description: |-
        Liệt kê lịch sử yêu cầu hoàn tiền đã được hệ thống ghi nhận cho vé; dữ liệu lấy từ lịch sử nội bộ.
        Yêu cầu đăng nhập. Quyền: khách hàng (KH), nhà xe (NX), quản trị viên (AD). Phạm vi: giới hạn theo vé trên đường dẫn và quyền sở hữu/phạm vi của người gọi.
      x-api-id: E05
      x-contract-status: proposed
      x-roles: [KH, NX, AD]
      security: [{cookieAuth: []}]
      x-authentication-required: true
      x-ownership: Giới hạn theo vé trên đường dẫn và quyền sở hữu/phạm vi.
      parameters:
        - {$ref: '#/components/parameters/MaVe'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - name: sort
          in: query
          required: false
          description: Allowlist field,asc|desc; mặc định thoiDiemTao,desc.
          schema:
            type: string
            enum: ['thoiDiemTao,asc', 'thoiDiemTao,desc']
            default: thoiDiemTao,desc
      responses:
        '200':
          description: Trang lịch sử yêu cầu hoàn của vé.
          headers:
            X-Trace-Id: {$ref: '#/components/headers/TraceId'}
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/PageResponse'}
                  - type: object
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/RefundResponse'}
              examples:
                success:
                  value: {items: [], page: 1, size: 20, totalItems: 0, totalPages: 0}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/hoan-tien/{maHoanTien}:
    get:
      tags: [E — Hủy vé và hoàn tiền]
      operationId: getRefund
      summary: "[E04] Tra cứu yêu cầu hoàn tiền"
      description: |-
        Tra cứu yêu cầu hoàn tiền. Trạng thái hoàn là chuỗi cho tới khi quy trình trạng thái được duyệt; CHO_XU_LY chỉ là ví dụ tạm.
        Yêu cầu đăng nhập. Quyền: khách hàng (KH), nhà xe (NX), quản trị viên (AD). Phạm vi: KH theo chủ vé; NX theo phạm vi; AD theo quyền quản trị.
      x-api-id: E04
      x-contract-status: proposed
      x-roles: [KH, NX, AD]
      security: [{cookieAuth: []}]
      x-authentication-required: true
      x-ownership: KH theo chủ vé; NX theo phạm vi; AD theo quyền quản trị.
      parameters:
        - {$ref: '#/components/parameters/MaHoanTien'}
      responses:
        '200':
          description: Yêu cầu hoàn, tiền do server tính và trạng thái hiện tại.
          headers:
            X-Trace-Id: {$ref: '#/components/headers/TraceId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RefundResponse'}
              examples:
                success:
                  value: {maHoanTien: HT01, maVe: VE01, maGiaoDichGoc: GD01, soTienHoan: '180000', trangThai: CHO_XU_LY, thoiDiemTao: '2026-10-11T10:00:00+07:00'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/kiem-ve/xac-minh:
    post:
      tags: [F — Kiểm vé]
      operationId: xacMinhVe
      summary: "[F01] Xác minh vé theo chuyến"
      description: |-
        Chỉ xác minh vé; không đổi trạng thái vé hoặc ghi nhận khách đã lên xe.
        Yêu cầu đăng nhập. Quyền: nhân viên (NV), nhà xe (NX), quản trị viên (AD). Phạm vi: NV theo chuyến được phân công; NX theo nhà xe trong phạm vi; AD theo quyền vận hành.
      x-api-id: F01
      x-contract-status: proposed
      x-roles: [NV, NX, AD]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      security: [{cookieAuth: []}]
      x-authentication-required: true
      x-ownership: NV theo chuyến được phân công; NX theo phạm vi; AD theo quyền vận hành.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TicketVerifyRequest'}
            examples:
              byTicket:
                value: {maChuyen: CX01, maVe: VE01}
            x-invalid-examples:
              missingTripId:
                value: {maVe: VE01}
      responses:
        '200':
          description: hopLe=false là kết quả xác minh nghiệp vụ, không phải lỗi HTTP.
          headers:
            X-Trace-Id: {$ref: '#/components/headers/TraceId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TicketVerifyResponse'}
              examples:
                valid:
                  value: {hopLe: true, maVe: VE01, maChuyen: CX01, maGhe: G11, maLyDo: null, lyDo: null}
                invalid:
                  value: {hopLe: false, maVe: VE99, maChuyen: CX01, maGhe: null, maLyDo: RESOURCE_NOT_FOUND, lyDo: Không tìm thấy vé hợp lệ cho chuyến này.}
        '400':
          description: Dữ liệu body không hợp lệ.
          headers:
            X-Trace-Id: {$ref: '#/components/headers/TraceId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                missingTripId:
                  value:
                    code: VALIDATION_ERROR
                    message: Request không hợp lệ.
                    details:
                      fieldErrors: [{field: maChuyen, code: REQUIRED, message: Cần gửi mã chuyến.}]
                    timestamp: '2026-10-11T09:30:00+07:00'
                    traceId: req-verify-validation-001
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/ve-xe/{maVe}/len-xe:
    post:
      tags: [F — Kiểm vé]
      operationId: xacNhanLenXe
      summary: "[F02] Xác nhận vé đã lên xe"
      description: |-
        Máy chủ kiểm tra vé, chuyến và phân công nhân viên trong một thao tác nguyên tử. Yêu cầu có tính lặp an toàn.
        Yêu cầu đăng nhập. Quyền: nhân viên (NV). Phạm vi: nhân viên phải được phân công trên maChuyen trong body.
      x-api-id: F02
      x-contract-status: proposed
      x-roles: [NV]
      security: [{cookieAuth: []}]
      x-authentication-required: true
      x-ownership: Nhân viên phải được phân công trên maChuyen trong body.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - {$ref: '#/components/parameters/MaVe'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CheckInRequest'}
            examples:
              checkIn:
                value: {maChuyen: CX01}
            x-invalid-examples:
              missingTripId:
                value: {}
      responses:
        '200':
          description: Vé đã được xác nhận lên xe.
          headers:
            X-Trace-Id: {$ref: '#/components/headers/TraceId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckInResponse'}
              examples:
                success:
                  value: {maVe: VE01, maChuyen: CX01, maGhe: G11, trangThai: DA_LEN_XE, thoiDiemLenXe: '2026-10-12T07:30:00+07:00'}
        '400':
          description: Dữ liệu body không hợp lệ.
          headers:
            X-Trace-Id: {$ref: '#/components/headers/TraceId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                missingTripId:
                  value:
                    code: VALIDATION_ERROR
                    message: Request không hợp lệ.
                    details:
                      fieldErrors: [{field: maChuyen, code: REQUIRED, message: Cần gửi mã chuyến.}]
                    timestamp: '2026-10-11T09:30:00+07:00'
                    traceId: req-checkin-validation-001
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: "409 nếu vé đã check-in hoặc trạng thái vé không cho phép lên xe; trường hợp sai trạng thái trả INVALID_STATE_TRANSITION. Cùng Idempotency-Key với nội dung khác trả IDEMPOTENCY_KEY_REUSED; yêu cầu cùng key đang xử lý trả REQUEST_IN_PROGRESS."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                alreadyCheckedIn:
                  value: {code: TICKET_ALREADY_CHECKED_IN, message: Vé đã được xác nhận lên xe., details: {maVe: VE01, maChuyen: CX01}, timestamp: '2026-10-12T07:30:01+07:00', traceId: req-checkin-007}
                invalidState:
                  value: {code: INVALID_STATE_TRANSITION, message: Trạng thái vé hiện tại không cho phép xác nhận lên xe., details: {maVe: VE02, maChuyen: CX01}, timestamp: '2026-10-12T07:30:02+07:00', traceId: req-checkin-008}
          headers:
            X-Trace-Id: {$ref: '#/components/headers/TraceId'}
  /api/chuyen-xe/{maChuyen}/kiem-ve:
    get:
      tags: [F — Kiểm vé]
      operationId: listTicketChecks
      summary: "[F03] Danh sách/log kiểm vé của chuyến"
      description: |-
        Liệt kê lịch sử kiểm vé của chuyến.
        Yêu cầu đăng nhập. Quyền: nhân viên (NV), nhà xe (NX). Phạm vi: NV theo phân công chuyến; NX theo nhà xe trong phạm vi.
