openapi: 3.1.0
info:
  title: Hệ thống đặt vé xe khách API
  version: 0.1.0-draft
  description: |-
    Hợp đồng mục tiêu A–F; API booking T16 đã triển khai được đánh dấu implemented.
    D04 chưa có phương thức và operation
    đang chờ nhóm thống nhất. Bản cập nhật ngày 2026-10-13 phản ánh API booking T16;
    T17 bổ sung hợp đồng C01/C02 cho báo giá và chốt giá; xem booking-pricing.md.
    Các phần còn lại giữ hợp đồng mục tiêu. Enum bám theo class diagram đã chốt.
    Những lựa chọn chưa chốt, gồm trạng thái khả dụng ghế và quy trình hoàn tiền,
    được đánh dấu trong tài liệu. T07 bổ sung phiên cookie datvexe_session;
    xem account-auth.md và account-openapi.yaml. Quyền nghiệp vụ A–F cần tích hợp T07.1.
  contact:
    name: Nhóm T05
servers:
  - url: /
    description: Gốc triển khai; các path bên dưới đã gồm tiền tố /api.
tags:
  - name: A — Tìm chuyến và xem ghế
  - name: B — Giữ chỗ và đơn đặt vé
  - name: C — Báo giá và phương thức thanh toán
  - name: D — Thanh toán và vé điện tử
  - name: E — Hủy vé và hoàn tiền
  - name: F — Kiểm vé
x-contract-status: proposed
paths:
  /api/tinh-thanh:
    get:
      tags: [A — Tìm chuyến và xem ghế]
      operationId: listTinhThanh
      summary: "[A01] Danh sách tỉnh thành"
      description: |-
        Danh sách tỉnh/thành để chọn điểm đi và điểm đến.
        Truy cập công khai; không cần đăng nhập. Phạm vi dữ liệu: thông tin công khai.
      x-api-id: A01
      x-contract-status: proposed
      x-roles: [public]
      x-authentication-required: false
      x-ownership: Chỉ dữ liệu công khai; không có dữ liệu gắn với tài khoản.
      responses:
        '200':
          description: Danh sách tỉnh thành; trả mảng rỗng nếu chưa có dữ liệu.
          headers:
            X-Trace-Id: {$ref: '#/components/headers/TraceId'}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/TinhThanh'}
              examples:
                success:
                  value:
                    - maTinhThanh: HCM
                      tenTinhThanh: Thành phố Hồ Chí Minh
                      khuVuc: Miền Nam
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/ben-xe:
    get:
      tags: [A — Tìm chuyến và xem ghế]
      operationId: listBenXe
      summary: "[A02] Danh sách bến xe"
      description: |-
        Danh sách bến xe; có thể lọc theo mã tỉnh/thành.
        Truy cập công khai; không cần đăng nhập. Phạm vi dữ liệu: thông tin công khai.
      x-api-id: A02
      x-contract-status: proposed
      x-roles: [public]
      x-authentication-required: false
      x-ownership: Chỉ dữ liệu bến xe công khai; không có dữ liệu gắn với tài khoản.
      parameters:
        - name: maTinhThanh
          in: query
          required: false
          description: Lọc theo mã tỉnh/thành; bộ lọc này là phần mở rộng đề xuất.
          schema: {$ref: '#/components/schemas/Id'}
      responses:
        '200':
          description: Mảng bến xe, không phân trang.
          headers:
            X-Trace-Id: {$ref: '#/components/headers/TraceId'}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/BenXe'}
              examples:
                success:
                  value:
                    - maBenXe: BX01
                      tenBenXe: Bến Miền Đông
                      diaChi: 292 Đinh Bộ Lĩnh, Bình Thạnh
                      soDienThoai: '02800000000'
                      maTinhThanh: HCM
                      trangThai: HOAT_DONG
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/chuyen-xe:
    get:
      tags: [A — Tìm chuyến và xem ghế]
      operationId: searchChuyenXe
      summary: "[A03] Tìm chuyến xe"
      description: |-
        Tìm chuyến theo điểm đi, điểm đến và ngày khởi hành. Hợp đồng đề xuất phân trang; API hiện tại trả mảng nên cần thống nhất trước khi triển khai. Số ghế là ảnh chụp tại thời điểm máy chủ trả lời.
        Truy cập công khai; không cần đăng nhập. Phạm vi dữ liệu: thông tin chuyến công khai.
      x-api-id: A03
      x-contract-status: proposed
      x-roles: [public]
      x-authentication-required: false
      x-ownership: Chỉ dữ liệu chuyến công khai; số ghế là ảnh chụp tại thời điểm máy chủ trả lời.
      parameters:
        - name: from
          in: query
          required: true
          description: Mã bến hoặc tỉnh/thành đi.
          schema: {$ref: '#/components/schemas/Id'}
        - name: to
          in: query
          required: true
          description: Mã bến hoặc tỉnh/thành đến, phải khác from.
          schema: {$ref: '#/components/schemas/Id'}
        - name: date
          in: query
          required: true
          description: Ngày khởi hành theo lịch địa phương Asia/Ho_Chi_Minh.
          schema: {$ref: '#/components/schemas/LocalDate'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - name: sort
          in: query
          required: false
          description: Allowlist field,asc|desc; mặc định gioKhoiHanh,asc.
          schema:
            type: string
            enum: ['gioKhoiHanh,asc', 'gioKhoiHanh,desc', 'giaThamKhao,asc', 'giaThamKhao,desc', 'soGheTrong,asc', 'soGheTrong,desc']
            default: gioKhoiHanh,asc
      responses:
        '200':
          description: Trang chuyến phù hợp; totalItems và totalPages là tổng toàn cục sau lọc, kể cả khi page vượt tổng thì items rỗng và các tổng vẫn giữ nguyên.
          headers:
            X-Trace-Id: {$ref: '#/components/headers/TraceId'}
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/PageResponse'}
                  - type: object
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/TripSummary'}
              examples:
                success:
                  value:
                    items:
                      - maChuyen: CX01
                        maTuyen: T01
                        benDi: {maBenXe: BX01, tenBenXe: Bến Miền Đông}
                        benDen: {maBenXe: BX02, tenBenXe: Bến Đà Lạt}
                        ngayKhoiHanh: '2026-10-12'
                        gioKhoiHanh: '08:00:00'
                        giaThamKhao: '250000'
                        soGheTrong: 12
                    page: 1
                    size: 20
                    totalItems: 1
                    totalPages: 1
                outOfRange:
                  value:
                    items: []
                    page: 3
                    size: 20
                    totalItems: 21
                    totalPages: 2
        '400':
          description: Tham số sai định dạng hoặc ngoài allowlist.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                invalidDate:
                  value:
                    code: VALIDATION_ERROR
                    message: Tham số date không hợp lệ.
                    details:
                      fieldErrors:
                        - {field: date, code: INVALID_FORMAT, message: Dùng YYYY-MM-DD.}
                    timestamp: '2026-10-11T09:30:00+07:00'
                    traceId: req-search-001
          headers:
            X-Trace-Id: {$ref: '#/components/headers/TraceId'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/chuyen-xe/{maChuyen}:
    get:
      tags: [A — Tìm chuyến và xem ghế]
      operationId: getChuyenXe
      summary: "[A04] Chi tiết chuyến xe"
      x-api-id: A04
      x-contract-status: proposed
      x-roles: [public]
      x-authentication-required: false
      x-ownership: Chỉ thông tin chuyến công khai; không có dữ liệu khách hàng.
      description: |-
        Hiển thị thông tin chuyến, xe, nhà xe và tiện ích; dữ liệu này không xác nhận chuyến đủ điều kiện đặt chỗ.
        Truy cập công khai; không cần đăng nhập. Phạm vi dữ liệu: thông tin chuyến công khai, không gồm dữ liệu khách hàng.
      parameters:
        - {$ref: '#/components/parameters/MaChuyen'}
      responses:
        '200':
          description: Chi tiết chuyến và thông tin tuyến, nhà xe, tiện ích công khai.
          headers:
            X-Trace-Id: {$ref: '#/components/headers/TraceId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TripDetail'}
              examples:
                success:
                  value:
                    maChuyen: CX01
                    maTuyen: T01
                    maXe: XE01
                    ngayKhoiHanh: '2026-10-12'
                    gioKhoiHanh: '08:00:00'
                    trangThai: CHUA_KHOI_HANH
                    benDi: {maBenXe: BX01, tenBenXe: Bến Miền Đông}
                    benDen: {maBenXe: BX02, tenBenXe: Bến Đà Lạt}
                    nhaXe: {maNhaXe: NX01, tenNhaXe: Nhà xe mẫu}
                    tienIch: [WIFI, MAY_LANH]
                    giaThamKhao: '250000'
                vehicleNotAssigned:
                  value:
                    maChuyen: CX02
                    maTuyen: T01
                    maXe: null
                    ngayKhoiHanh: '2026-10-12'
                    gioKhoiHanh: '10:00:00'
                    trangThai: CHUA_KHOI_HANH
                    benDi: {maBenXe: BX01, tenBenXe: Bến Miền Đông}
                    benDen: {maBenXe: BX02, tenBenXe: Bến Đà Lạt}
                    nhaXe: null
                    tienIch: []
                    giaThamKhao: '250000'
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/chuyen-xe/{maChuyen}/ghe:
    get:
      tags: [A — Tìm chuyến và xem ghế]
      operationId: getSoDoGhe
      summary: "[A05] Sơ đồ ghế theo chuyến"
      description: |-
        Hiển thị sơ đồ ghế và trạng thái khả dụng tại thời điểm serverTime; không tiết lộ người đang giữ ghế.
        Truy cập công khai; không cần đăng nhập. Phạm vi dữ liệu: ảnh chụp khả dụng ghế.
      x-api-id: A05
      x-contract-status: proposed
      x-roles: [public]
      x-authentication-required: false
      x-ownership: Ảnh chụp khả dụng ghế công khai; không tiết lộ người đang giữ ghế.
      parameters:
        - {$ref: '#/components/parameters/MaChuyen'}
      responses:
        '200':
          description: Sơ đồ và trạng thái sử dụng/khả dụng của từng ghế.
          headers:
            X-Trace-Id: {$ref: '#/components/headers/TraceId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SeatMapResponse'}
              examples:
                success:
                  value:
                    maChuyen: CX01
                    maXe: XE01
                    serverTime: '2026-10-11T09:30:00+07:00'
                    danhSachGhe:
                      - maGhe: G11
                        viTri: {tang: 1, hang: A, cot: 1}
                        trangThaiSuDung: HOAT_DONG
                        tinhTrangKhaDung: TRONG
                      - maGhe: G12
                        viTri: {tang: 1, hang: A, cot: 2}
                        trangThaiSuDung: HOAT_DONG
                        tinhTrangKhaDung: TRONG
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Chuyến chưa được gán xe nên chưa có sơ đồ ghế.
          headers:
            X-Trace-Id: {$ref: '#/components/headers/TraceId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                vehicleNotAssigned:
                  value: {code: INVALID_STATE_TRANSITION, message: Chuyến chưa được gán xe nên chưa có sơ đồ ghế., details: {}, timestamp: '2026-10-11T09:30:00+07:00', traceId: req-seatmap-vehicle-001}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/chuyen-xe/{maChuyen}/gia:
    get:
      tags: [A — Tìm chuyến và xem ghế]
      operationId: getGiaThamKhao
      summary: "[A06] Giá tham khảo theo ghế"
      description: |-
        Giá theo ghế chỉ để tham khảo; C02 mới chốt giá.
        Truy cập công khai; không cần đăng nhập. Phạm vi dữ liệu: giá tham khảo, không khóa giá.
      x-api-id: A06
      x-contract-status: proposed
      x-roles: [public]
      x-authentication-required: false
      x-ownership: Chỉ giá tham khảo công khai; không khóa giá.
      parameters:
        - {$ref: '#/components/parameters/MaChuyen'}
      responses:
        '200':
          description: Giá tham khảo theo ghế hoặc loại ghế.
          headers:
            X-Trace-Id: {$ref: '#/components/headers/TraceId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReferencePriceResponse'}
              examples:
                success:
                  value:
                    maChuyen: CX01
                    donViTienTe: VND
                    giaThamKhao: '250000'
                    danhSachGiaTheoLoaiGhe:
                      - {loaiGhe: GIUONG_NAM, gia: '250000'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/booking/hold:
    post:
      tags:
      - B — Giữ chỗ và đơn đặt vé
      operationId: holdSeatsAndCreateOrder
      summary: B01 Hold seats and create a draft order
      description: KHACH_HANG only. The authenticated session owns the order. Hold every requested seat atomically
        for 15 minutes; expiry is evaluated at now >= thoiDiemHetHan.
      x-roles:
      - KHACH_HANG
      parameters:
      - $ref: '#/components/parameters/BookingCsrfToken'
      - $ref: '#/components/parameters/BookingIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingHoldRequest'
            example:
              maChuyen: CX01
              danhSachMaGhe:
              - G11
              - G12
      responses:
        '201':
          description: Order and holds created atomically.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingHoldSeatResponse'
        '400':
          $ref: '#/components/responses/BookingBadRequest'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '403':
          $ref: '#/components/responses/BookingForbidden'
        '404':
          $ref: '#/components/responses/BookingNotFound'
        '409':
          $ref: '#/components/responses/BookingConflict'
      x-api-id: B01
      x-contract-status: implemented
  /api/booking/{maDon}:
    parameters:
    - $ref: '#/components/parameters/BookingMaDon'
    get:
      tags:
      - B — Giữ chỗ và đơn đặt vé
      operationId: getBookingOrder
      summary: B02/B05 Get an order and its current preview
      description: KHACH_HANG only; the caller must own the order. Passenger data is returned only when this authenticated
        account and order have a snapshot in the current JSESSIONID. A new servlet session still loads the persisted
        order and holds, with hanhKhach=[] and coTheChotGia=false. Paid orders remain readable; maChuyen is derived
        from holds or tickets. Historical orders without holds may have thoiDiemBatDau and thoiDiemHetHan null. A
        GET reports an invalid selected promotion without clearing it from storage. When expiry is first detected,
        it commits the hold and order as HET_HAN and returns 409 HOLD_EXPIRED.
      x-roles:
      - KHACH_HANG
      responses:
        '200':
          description: Current order, holds, issued tickets, and price preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingOrderResponse'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '403':
          $ref: '#/components/responses/BookingForbidden'
        '404':
          $ref: '#/components/responses/BookingNotFound'
        '409':
          $ref: '#/components/responses/BookingConflict'
      x-api-id: B02/B05
      x-contract-status: implemented
    patch:
      tags:
      - B — Giữ chỗ và đơn đặt vé
      operationId: patchBookingContact
      summary: B03 Update order contact fields
      description: KHACH_HANG only; owner access. Only khachDatTen, khachDatSoDienThoai, and ghiChu are accepted.
        At least one field is required. PATCH does not extend the hold. PostgreSQL stores a redacted idempotency response
        with hanhKhach=[] and coTheChotGia=false. A complete response replay is available only if the full response
        cache was written and remains in the current HTTP session. The cache may be absent after a crash between database
        commit and the session write, or after session loss; retry then returns the redacted database order state.
        Read the order to verify the current session snapshot or re-enter passengers if the session was lost.
      x-roles:
      - KHACH_HANG
      parameters:
      - $ref: '#/components/parameters/BookingCsrfToken'
      - $ref: '#/components/parameters/BookingIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingContactPatch'
            example:
              khachDatTen: Nguyen Van A
              khachDatSoDienThoai: 0900000001
              ghiChu: null
      responses:
        '200':
          description: Updated order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingOrderResponse'
        '400':
          $ref: '#/components/responses/BookingBadRequest'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '403':
          $ref: '#/components/responses/BookingForbidden'
        '404':
          $ref: '#/components/responses/BookingNotFound'
        '409':
          $ref: '#/components/responses/BookingConflict'
      x-api-id: B03
      x-contract-status: implemented
  /api/booking:
    get:
      tags: [B — Giữ chỗ và đơn đặt vé]
      operationId: listDonDatVe
      summary: "[B06] Danh sách đơn của khách"
      description: |-
        Liệt kê các đơn thuộc khách hàng đang đăng nhập.
        Yêu cầu đăng nhập. Quyền: khách hàng (KH). Phạm vi: chỉ các đơn của danh tính hiện tại; không nhận maNguoiDung từ request.
      x-api-id: B06
      x-contract-status: proposed
      x-roles: [KH]
      security: [{cookieAuth: []}]
      x-authentication-required: true
      x-ownership: Kết quả chỉ gồm đơn thuộc danh tính hiện tại; không nhận maNguoiDung.
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - name: trangThaiDon
          in: query
          required: false
          schema: {$ref: '#/components/schemas/TrangThaiDon'}
        - name: maChuyen
          in: query
          required: false
          schema: {$ref: '#/components/schemas/Id'}
        - name: tuNgay
          in: query
          required: false
          description: Ngày tạo đơn đầu tiên được bao gồm.
          schema: {$ref: '#/components/schemas/LocalDate'}
        - name: denNgay
          in: query
          required: false
          description: Ngày tạo đơn cuối cùng được bao gồm.
          schema: {$ref: '#/components/schemas/LocalDate'}
        - name: sort
          in: query
          required: false
          description: Allowlist field,asc|desc; mặc định ngayTao,desc.
          schema:
            type: string
            enum: ['ngayTao,asc', 'ngayTao,desc', 'thoiDiemKhoiHanh,asc', 'thoiDiemKhoiHanh,desc']
            default: ngayTao,desc
      responses:
        '200':
          description: Trang đơn của người gọi; items rỗng khi không có kết quả.
          headers:
            X-Trace-Id: {$ref: '#/components/headers/TraceId'}
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/PageResponse'}
                  - type: object
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/OrderResponse'}
              examples:
                success:
                  value: {items: [], page: 1, size: 20, totalItems: 0, totalPages: 0}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /api/booking/{maDon}/huy:
    parameters:
    - $ref: '#/components/parameters/BookingMaDon'
    post:
      tags:
      - B — Giữ chỗ và đơn đặt vé
      operationId: cancelBookingOrder
      summary: B07 Cancel a draft order
      description: KHACH_HANG only; owner access. The JSON body is optional; send {} when a body is required by the
        client. Repeated cancellation of the same order is idempotent and clears passenger data from the current HTTP
        session.
      x-roles:
      - KHACH_HANG
      parameters:
      - $ref: '#/components/parameters/BookingCsrfToken'
      - $ref: '#/components/parameters/BookingIdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
            example: {}
      responses:
        '200':
          description: Order is cancelled and holds are released.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingOrderResponse'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '403':
          $ref: '#/components/responses/BookingForbidden'
        '404':
          $ref: '#/components/responses/BookingNotFound'
        '409':
          $ref: '#/components/responses/BookingConflict'
      x-api-id: B07
      x-contract-status: implemented
  /api/booking/{maDon}/hanh-khach:
    parameters:
    - $ref: '#/components/parameters/BookingMaDon'
    put:
      tags:
