      parameters:
        - {$ref: '#/components/parameters/MaChuyen'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - name: maGhe
          in: query
          required: false
          schema: {$ref: '#/components/schemas/Id'}
        - name: tuThoiDiem
          in: query
          required: false
          schema: {$ref: '#/components/schemas/OffsetDateTime'}
        - name: denThoiDiem
          in: query
          required: false
          schema: {$ref: '#/components/schemas/OffsetDateTime'}
        - name: sort
          in: query
          required: false
          description: Allowlist field,asc|desc; mặc định thoiDiemKiem,desc.
          schema:
            type: string
            enum: ['thoiDiemKiem,asc', 'thoiDiemKiem,desc', 'maVe,asc', 'maVe,desc']
            default: thoiDiemKiem,desc
      responses:
        '200':
          description: Trang log kiểm vé trong phạm vi chuyến được phép xem.
          headers:
            X-Trace-Id: {$ref: '#/components/headers/TraceId'}
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/PageResponse'}
                  - type: object
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/TicketCheckLog'}
              examples:
                success:
                  value:
                    items: [{maVe: VE01, maChuyen: CX01, maGhe: G11, ketQua: DA_LEN_XE, thoiDiemKiem: '2026-10-12T07:30:00+07:00'}]
                    page: 1
                    size: 20
                    totalItems: 1
                    totalPages: 1
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/booking/{maDon}/ghe/{maGhe}:
    parameters:
    - $ref: '#/components/parameters/BookingMaDon'
    - $ref: '#/components/parameters/BookingMaGhe'
    delete:
      tags:
      - B — Giữ chỗ và đơn đặt vé
      operationId: dropBookingSeat
      summary: B08a Drop a held seat
      description: KHACH_HANG only; owner access. Remove the passenger for this seat from the current HTTP session.
        Dropping the last held seat ends the draft order as DA_HUY and clears its passenger snapshot.
      x-roles:
      - KHACH_HANG
      parameters:
      - $ref: '#/components/parameters/BookingCsrfToken'
      responses:
        '200':
          description: Updated order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingOrderResponse'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '403':
          $ref: '#/components/responses/BookingForbidden'
        '404':
          $ref: '#/components/responses/BookingNotFound'
        '409':
          $ref: '#/components/responses/BookingConflict'
      x-api-id: B08a
      x-contract-status: implemented
  /api/booking/{maDon}/doi-ghe:
    parameters:
    - $ref: '#/components/parameters/BookingMaDon'
    put:
      tags:
      - B — Giữ chỗ và đơn đặt vé
      operationId: swapBookingSeat
      summary: B08b Change one held seat
      description: KHACH_HANG only; owner access. The old hold is released and new hold is created atomically. Move
        the passenger maGhe to the new seat while preserving passenger fields. A failed swap leaves the old hold and
        session snapshot unchanged.
      x-roles:
      - KHACH_HANG
      parameters:
      - $ref: '#/components/parameters/BookingCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingSeatSwapRequest'
            example:
              maGheCu: G11
              maGheMoi: G13
      responses:
        '200':
          description: Updated order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingOrderResponse'
        '400':
          $ref: '#/components/responses/BookingBadRequest'
        '401':
          $ref: '#/components/responses/BookingUnauthorized'
        '403':
          $ref: '#/components/responses/BookingForbidden'
        '404':
          $ref: '#/components/responses/BookingNotFound'
        '409':
          $ref: '#/components/responses/BookingConflict'
      x-api-id: B08b
      x-contract-status: implemented
  /api/booking/{maDon}/khuyen-mai:
    parameters:
    - $ref: '#/components/parameters/BookingMaDon'
    put:
      tags:
      - B — Giữ chỗ và đơn đặt vé
      operationId: selectBookingPromotion
      summary: B08c Select a promotion for preview
      description: KHACH_HANG only; owner access. Selection does not reserve quota or round preview amounts. Use DELETE
        on this resource to remove the selected code.
      x-roles:
      - KHACH_HANG
      parameters:
      - $ref: '#/components/parameters/BookingCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingPromotionSelection'
