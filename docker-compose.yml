services:
  backend:
    image: tomcat:10.1-jdk21
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-datvexe}
      POSTGRES_USER: ${POSTGRES_USER:-datvexe_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datvexe_password}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      VEHICLE_TURNAROUND_MINUTES: ${VEHICLE_TURNAROUND_MINUTES:-30}
      TRIP_BOOKING_CUTOFF_MINUTES: ${TRIP_BOOKING_CUTOFF_MINUTES:-60}
      VNP_TMN_CODE: ${VNP_TMN_CODE:-}
      VNP_HASH_SECRET: ${VNP_HASH_SECRET:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-Vexexin}
      EMAIL_NOTIFICATIONS_ENABLED: ${EMAIL_NOTIFICATIONS_ENABLED:-true}
      TRIP_CANCELLATION_REFUND_APPROVED: ${TRIP_CANCELLATION_REFUND_APPROVED:-false}
      VNP_RETURN_URL: ${VNP_RETURN_URL:-http://localhost:3000/thanh-toan/return}
    volumes:
      - ./src/backend/target/he-thong-dat-ve-xe-khach-0.1.0-SNAPSHOT.war:/usr/local/tomcat/webapps/ROOT.war:ro
      - ./src/backend/target/he-thong-dat-ve-xe-khach-0.1.0-SNAPSHOT/WEB-INF/lib/postgresql-42.7.5.jar:/usr/local/tomcat/lib/postgresql-42.7.5.jar:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: datvexe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datvexe}
      POSTGRES_USER: ${POSTGRES_USER:-datvexe_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datvexe_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/database/schema/001_route_trip.sql:/docker-entrypoint-initdb.d/001_route_trip.sql:ro
      - ./docs/database/schema/002_vehicle_alignment.sql:/docker-entrypoint-initdb.d/002_vehicle_alignment.sql:ro
      - ./docs/database/schema/003_account_auth.sql:/docker-entrypoint-initdb.d/003_account_auth.sql:ro
      - ./docs/database/schema/004_booking_order.sql:/docker-entrypoint-initdb.d/004_booking_order.sql:ro
      - ./docs/database/schema/005_booking_session.sql:/docker-entrypoint-initdb.d/005_booking_session.sql:ro
      - ./docs/database/schema/006_payment_vnpay.sql:/docker-entrypoint-initdb.d/006_payment_vnpay.sql:ro
      - ./docs/database/schema/007_booking_email.sql:/docker-entrypoint-initdb.d/007_booking_email.sql:ro
      - ./docs/database/schema/008_ticket_public_code.sql:/docker-entrypoint-initdb.d/008_ticket_public_code.sql:ro
      - ./docs/database/schema/009_ticket_qr_email.sql:/docker-entrypoint-initdb.d/009_ticket_qr_email.sql:ro
      - ./docs/database/schema/010_refund_policy.sql:/docker-entrypoint-initdb.d/010_refund_policy.sql:ro
      - ./docs/database/schema/011_refund_tracking.sql:/docker-entrypoint-initdb.d/011_refund_tracking.sql:ro
      - ./docs/database/schema/012_ticket_checkin.sql:/docker-entrypoint-initdb.d/012_ticket_checkin.sql:ro
      - ./docs/database/schema/013_trip_lifecycle.sql:/docker-entrypoint-initdb.d/013_trip_lifecycle.sql:ro
      - ./docs/database/schema/014_trip_reviews.sql:/docker-entrypoint-initdb.d/014_trip_reviews.sql:ro
      - ./docs/database/seed/001_catalog.sql:/docker-entrypoint-initdb.d/004_catalog.sql:ro
      - ./docs/database/seed/002_accounts_staff_fleet.sql:/docker-entrypoint-initdb.d/005_accounts_staff_fleet.sql:ro
      - ./docs/database/seed/003_routes_trips.sql:/docker-entrypoint-initdb.d/006_routes_trips.sql:ro

  migrate:
    image: postgres:16
    profiles: [ops]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datvexe}
      POSTGRES_USER: ${POSTGRES_USER:-datvexe_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datvexe_password}
    volumes:
      - ./docs/database/schema:/migrations/schema:ro
      - ./scripts/apply-migrations.sh:/migrations/apply.sh:ro
    entrypoint: ["/bin/sh", "/migrations/apply.sh"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
