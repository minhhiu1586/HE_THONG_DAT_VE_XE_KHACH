services:
  backend:
    image: tomcat:10.1-jdk21
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-datvexe}
      POSTGRES_USER: ${POSTGRES_USER:-datvexe_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datvexe_password}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      VEHICLE_TURNAROUND_MINUTES: ${VEHICLE_TURNAROUND_MINUTES:-30}
      TRIP_BOOKING_CUTOFF_MINUTES: ${TRIP_BOOKING_CUTOFF_MINUTES:-60}
    volumes:
      - ./src/backend/target/he-thong-dat-ve-xe-khach-0.1.0-SNAPSHOT.war:/usr/local/tomcat/webapps/ROOT.war:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: datvexe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datvexe}
      POSTGRES_USER: ${POSTGRES_USER:-datvexe_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datvexe_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/database/schema/001_route_trip.sql:/docker-entrypoint-initdb.d/001_route_trip.sql:ro
      - ./docs/database/schema/002_vehicle_alignment.sql:/docker-entrypoint-initdb.d/002_vehicle_alignment.sql:ro
      - ./docs/database/schema/003_account_auth.sql:/docker-entrypoint-initdb.d/003_account_auth.sql:ro
      - ./docs/database/seed/001_demo.sql:/docker-entrypoint-initdb.d/004_demo.sql:ro
      - ./docs/database/seed/002_fleet_demo.sql:/docker-entrypoint-initdb.d/005_fleet_demo.sql:ro
      - ./docs/database/seed/003_t06_transport.sql:/docker-entrypoint-initdb.d/006_transport.sql:ro
      - ./docs/database/seed/005_t06_display_alignment.sql:/docker-entrypoint-initdb.d/007_display_alignment.sql:ro
      - ./docs/database/seed/006_t11_staff.sql:/docker-entrypoint-initdb.d/008_staff.sql:ro

  migrate:
    image: postgres:16
    profiles: [ops]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datvexe}
      POSTGRES_USER: ${POSTGRES_USER:-datvexe_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datvexe_password}
    volumes:
      - ./docs/database/schema:/migrations/schema:ro
      - ./scripts/apply-migrations.sh:/migrations/apply.sh:ro
    entrypoint: ["/bin/sh", "/migrations/apply.sh"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
